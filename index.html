<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZFX-W2053 加热台说明书</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#1a1a2e;display:flex;flex-direction:column;height:100vh;overflow:hidden}
        .header{background:#16213e;color:#e0e0e0;padding:8px;font-size:14px;text-align:center;flex-shrink:0}
        .canvas-wrap{flex:1;overflow:auto;display:flex;justify-content:center;background:#333}
        canvas{display:block}
    </style>
</head>
<body>
    <div class="header">ZFX-W2053 加热台说明书</div>
    <div class="canvas-wrap" id="container"></div>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        pdfjsLib.getDocument('manual.pdf').promise.then(function(pdf) {
            var container = document.getElementById('container');
            for (var i = 1; i <= pdf.numPages; i++) {
                pdf.getPage(i).then(function(page) {
                    var scale = Math.min((container.clientWidth - 16) / page.getViewport({scale:1}).width, 1.2);
                    var viewport = page.getViewport({scale: scale});
                    var canvas = document.createElement('canvas');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    container.appendChild(canvas);
                    page.render({canvasContext: canvas.getContext('2d'), viewport: viewport});
                });
            }
        });
    </script>
</body>
</html>
